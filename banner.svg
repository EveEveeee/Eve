<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" role="img" aria-labelledby="title desc">
  <title id="title">Eve OS — AI Product Manager</title>
  <desc id="desc">A light terminal introducing Eve's product thinking, AI experiments, and open-source contributions.</desc>
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
    .body { fill: #566573; font-size: 17px; }
    .prompt { fill: #3478c9; font-size: 17px; font-weight: 600; }
    .ok { fill: #42956c; font-weight: 700; }
    .line { animation: reveal .65s ease-out both; }
    .l2 { animation-delay: .25s; } .l3 { animation-delay: .5s; }
    .l4 { animation-delay: .75s; } .l5 { animation-delay: 1s; }
    .l6 { animation-delay: 1.25s; } .l7 { animation-delay: 1.5s; }
    .cursor { animation: blink 1.2s steps(1) infinite; }
    @keyframes reveal { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .line, .cursor { animation: none; opacity: 1; } }
  </style>
  <rect x="1" y="1" width="998" height="518" rx="18" fill="#f8fafb" stroke="#d8e0e7" stroke-width="2"/>
  <path d="M19 2h962a18 18 0 0 1 18 18v31H1V20A18 18 0 0 1 19 2z" fill="#f1f4f6"/>
  <line x1="1" y1="52" x2="999" y2="52" stroke="#d8e0e7"/>
  <circle cx="24" cy="27" r="7" fill="#ef6461"/>
  <circle cx="47" cy="27" r="7" fill="#efbd4e"/>
  <circle cx="70" cy="27" r="7" fill="#55b96f"/>
  <text x="500" y="31" text-anchor="middle" class="mono" fill="#8694a1" font-size="12" letter-spacing=".8">eve@studio — product journal — 100×30</text>
  <text x="54" y="97" class="mono line" fill="#526273" font-size="22" font-weight="700">EVE OS v1.0 — Thoughtful by design</text>
  <text x="54" y="139" class="mono body line l2">[ <tspan class="ok">OK</tspan> ] Load product-thinking.ai</text>
  <text x="54" y="175" class="mono body line l3">[ <tspan class="ok">OK</tspan> ] Mount /experiments    Ideas into prototypes</text>
  <text x="54" y="211" class="mono body line l4">[ <tspan class="ok">OK</tspan> ] Mount /agents         AI in real workflows</text>
  <text x="54" y="247" class="mono body line l5">[ <tspan class="ok">OK</tspan> ] Mount /contributions  Evidence before conclusions</text>
  <text x="54" y="301" class="mono prompt line l6">eve@studio ~ % <tspan class="body">whoami</tspan></text>
  <text x="54" y="335" class="mono body line l6">Eve · AI Product Manager · Curious builder</text>
  <text x="54" y="389" class="mono prompt line l7">eve@studio ~ % <tspan class="body">explore selected-work</tspan><tspan class="cursor"> ▍</tspan></text>
  <line x1="54" y1="421" x2="946" y2="421" stroke="#e1e7ed"/>
  <text x="54" y="458" class="mono" fill="#526273" font-size="14">Think carefully. Build with purpose. Keep learning.</text>
  <text x="946" y="488" text-anchor="end" class="mono" fill="#3478c9" font-size="13" letter-spacing="1.4">EXPLORE BELOW ↓</text>
</svg>
